<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Kartik Tiwari animated developer ID card">
<title>kartiktiwari@github:~$ cat dev_identity.card</title>

<style>
  .bg { fill: #050709; }
  .chrome { fill: #101418; }
  .titleText {
    font-family: 'Courier New', ui-monospace, monospace;
    font-size: 11px;
    fill: #8b949e;
  }
  text { font-family: 'Courier New', ui-monospace, monospace; }
  .label {
    font-size: 9px;
    letter-spacing: 2px;
    fill: #3f8fc4;
    font-weight: 700;
  }
  .value {
    font-size: 15px;
    fill: #eaf6ff;
    font-weight: 700;
  }
  .valueBig {
    font-size: 21px;
    fill: #ffffff;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .pill {
    fill: none;
    stroke: #36BCF7;
    stroke-opacity: 0.55;
  }
  .pillText {
    font-size: 10px;
    fill: #a9e2ff;
    font-weight: 700;
    dominant-baseline: middle;
  }
  .divider { stroke: #1c2733; stroke-width: 1; }
  .statusText { font-size: 12px; fill: #d7ecfa; }
  .handleText { font-size: 11px; fill: #52697d; }
  .hexShape {
    fill: none;
    stroke: #36BCF7;
    stroke-width: 1.4;
    animation: pulseGlow 3s ease-in-out infinite;
  }
  .hexRing {
    fill: none;
    stroke: #6fc4e8;
    stroke-width: 1;
    stroke-dasharray: 6 5;
    stroke-opacity: 0.65;
  }
  .icon {
    font-size: 20px;
    fill: #7fd4ff;
    font-weight: 700;
    text-anchor: middle;
  }
  .idTag {
    font-size: 8.5px;
    fill: #4a7a99;
    text-anchor: middle;
    letter-spacing: 1px;
  }
  .orbitDot { fill: #ffffff; }
  .statusDot {
    fill: #3ddc84;
    animation: blinkDot 1.6s ease-in-out infinite;
  }
  .cursor {
    fill: #36BCF7;
    animation: blinkCursor 1s steps(1) infinite;
  }
  .frame {
    fill: none;
    stroke: #36BCF7;
    stroke-opacity: 0.5;
    stroke-width: 1.4;
    animation: pulseGlow 3s ease-in-out infinite;
  }
  .ambient {
    fill: url(#ambient);
    animation: breathe 4.5s ease-in-out infinite;
  }
  .scanBeam {
    animation: sweepY 4.5s linear infinite;
  }
  .barSweep {
    animation: sweepX 3.2s ease-in-out infinite;
  }
  .dot { opacity: 0.9; }

  @keyframes pulseGlow {
    0%, 100% { stroke-opacity: 0.35; }
    50%      { stroke-opacity: 0.85; }
  }
  @keyframes blinkDot {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }
  @keyframes blinkCursor {
    0%, 49%  { opacity: 1; }
    50%,100% { opacity: 0; }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.30; }
    50%      { opacity: 0.60; }
  }
  @keyframes sweepY {
    0%   { transform: translateY(-6px); opacity: 0; }
    8%   { opacity: 0.9; }
    92%  { opacity: 0.9; }
    100% { transform: translateY(256px); opacity: 0; }
  }
  @keyframes sweepX {
    0%   { transform: translateX(0px); }
    50%  { transform: translateX(560px); }
    100% { transform: translateX(0px); }
  }
</style>

<defs>
  <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#36BCF7" stop-opacity="0"/>
    <stop offset="50%" stop-color="#bdeeff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#36BCF7" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="ambient" cx="18%" cy="55%" r="55%">
    <stop offset="0%" stop-color="#1c6fa8" stop-opacity="0.55"/>
    <stop offset="60%" stop-color="#0f2f47" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#050709" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="barGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

